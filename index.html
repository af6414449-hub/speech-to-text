<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Диктофон</title>
  <style>
    /* --- Глобальные сбросы --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html,
    body {
      height: 100%;
      overflow: hidden;
    }
    body {
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      font-family: system-ui, -apple-system, sans-serif;
    }
    /* --- Контейнер приложения --- */
    .app {
      width: 100%;
      max-width: 600px;
      height: 100%;
      max-height: 700px;
      background: white;
      border-radius: 24px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    /* --- Список блоков (общий контейнер) --- */
    .blocks {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 4px 0 12px 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }
    /* --- Отдельный блок --- */
    .block {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 12px 16px;
      border-left: 4px solid #4CAF50;
      position: relative;
      max-width: 100%;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    /* --- Оранжевый (живой) блок --- */
    .block.live {
      border-left-color: #ff9800;
      background: #fff8e1;
    }
    .block.live .block-time {
      color: #ff9800;
    }
    /* --- Свёрнутый блок (показывает только первую строку) --- */
    .block.collapsed .block-text {
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: normal;
    }
    /* --- Развёрнутый блок (показывает весь текст, с внутренним скроллом) --- */
    .block.expanded .block-text {
      display: block;
      white-space: pre-wrap;
      max-height: 300px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-right: 4px;
    }
    /* --- Текст внутри блока --- */
    .block-text {
      font-size: 16px;
      line-height: 1.6;
      color: #1a1a1a;
      word-break: break-word;
    }
    .block-time {
      font-size: 11px;
      color: #999;
      margin-top: 4px;
      display: block;
    }
    /* --- Подсказки свайпа --- */
    .block .swipe-hint {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 12px;
      color: #999;
      opacity: 0;
      transition: 0.3s;
      pointer-events: none;
    }
    .block .swipe-hint.left {
      left: -60px;
    }
    .block .swipe-hint.right {
      right: -60px;
    }
    .block.swiping-left .swipe-hint.left {
      opacity: 1;
    }
    .block.swiping-right .swipe-hint.right {
      opacity: 1;
    }
    /* --- Исправленный блок (после свайпа влево) --- */
    .block.fixed {
      border-left-color: #2196F3;
      background: #e3f2fd;
    }
    .block.fixed .block-time::after {
      content: ' ✨';
    }
    /* --- Кнопки внизу --- */
    .buttons {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding-top: 16px;
      border-top: 1px solid #eee;
      flex-shrink: 0;
    }
    .btn-clear,
    .btn-copy,
    .btn-save,
    .btn-record {
      border: none;
      border-radius: 50%;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    .btn-clear:active,
    .btn-copy:active,
    .btn-save:active,
    .btn-record:active {
      transform: scale(0.9);
    }
    .btn-clear:disabled,
    .btn-copy:disabled,
    .btn-save:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      transform: none;
    }
    .btn-clear {
      width: 56px;
      height: 56px;
      font-size: 24px;
      background: #ff1744;
      color: white;
      box-shadow: 0 2px 8px rgba(255, 23, 68, 0.3);
    }
    .btn-clear:disabled {
      box-shadow: none;
    }
    .btn-copy {
      width: 56px;
      height: 56px;
      font-size: 24px;
      background: #e0e0e0;
      color: #999;
    }
    .btn-copy.active {
      background: #f9a825;
      color: white;
      box-shadow: 0 2px 8px rgba(249, 168, 37, 0.3);
    }
    .btn-save {
      width: 56px;
      height: 56px;
      font-size: 24px;
      background: #e0e0e0;
      color: #999;
    }
    .btn-save.active {
      background: #42a5f5;
      color: white;
      box-shadow: 0 2px 8px rgba(66, 165, 245, 0.3);
    }
    .btn-record {
      width: 80px;
      height: 80px;
      font-size: 36px;
      background: #4CAF50;
      color: white;
      box-shadow: 0 4px 12px rgba(76, 175, 80, 0.3);
    }
    .btn-record.active {
      background: #f44336;
      box-shadow: 0 4px 12px rgba(244, 67, 54, 0.3);
    }
    /* --- Toast-уведомления --- */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      opacity: 0;
      transition: 0.3s;
      pointer-events: none;
      white-space: nowrap;
      z-index: 1000;
    }
    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="blocks" id="blocks"></div>
    <div class="buttons">
      <button class="btn-clear" id="clear" disabled>✕</button>
      <button class="btn-copy" id="copy" disabled>📄</button>
      <button class="btn-save" id="save" disabled>💾</button>
      <button class="btn-record" id="record">▶</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    (function() {
      const blocksEl = document.getElementById('blocks');
      const recordBtn = document.getElementById('record');
      const saveBtn = document.getElementById('save');
      const copyBtn = document.getElementById('copy');
      const clearBtn = document.getElementById('clear');
      const toast = document.getElementById('toast');

      // --- Состояние ---
      let isRecording = false;
      let blocksData = [];
      let recognition = null;
      let restartTimer = null;
      let accumulatedText = '';
      let liveBlockIndex = -1;

      // --- Swipe ---
      let swipeState = {
        startX: 0,
        startY: 0,
        isSwiping: false,
        currentElement: null,
        currentIndex: -1
      };

      // --- Проверка поддержки SpeechRecognition ---
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        toast.textContent = '❌ Браузер не поддерживает';
        toast.classList.add('show');
        recordBtn.disabled = true;
        return;
      }

      // --- Вспомогательные функции ---
      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(toast._timer);
        toast._timer = setTimeout(() => toast.classList.remove('show'), 3000);
      }

      function getFullTimestamp() {
        const now = new Date();
        const pad = n => String(n).padStart(2, '0');
        return now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate()) +
          ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
      }

      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      // --- Работа с localStorage ---
      function saveToStorage() {
        try {
          const data = blocksData.filter(b => !b.live);
          localStorage.setItem('blocks', JSON.stringify(data));
        } catch (_) {}
      }

      function loadFromStorage() {
        try {
          const raw = localStorage.getItem('blocks');
          if (raw) {
            blocksData = JSON.parse(raw);
            blocksData = blocksData.map(b => ({
              ...b,
              collapsed: b.collapsed !== undefined ? b.collapsed : true,
              live: false,
              fixed: b.fixed || false,
              originalText: b.originalText || b.text
            }));
            renderBlocks();
          }
        } catch (_) {}
      }

      // --- Постобработка текста (точка в конце + заглавная после точки) ---
      function capitalizeAfterPunctuation(text) {
        return text.replace(/([.!?])\s*([а-яё])/gi, (match, punct, letter) => {
          return punct + ' ' + letter.toUpperCase();
        });
      }

      function insertDotsBeforeUppercase(text) {
        // Ставим точку перед любой заглавной буквой в середине предложения,
        // если перед ней нет . ! ?
        return text.replace(/(?<![.!?])\s+([А-ЯЁ])/g, (match, letter) => {
          return '. ' + letter;
        });
      }

      function postProcessText(text) {
        if (!text || !text.trim()) return text;
        let result = text.trim();

        // 1. Ставим точку перед заглавными в середине предложения
        result = insertDotsBeforeUppercase(result);

        // 2. Ставим точку в конце, если её нет
        const lastChar = result[result.length - 1];
        if (lastChar && !['.', '!', '?'].includes(lastChar)) {
          result += '.';
        }

        // 3. Заглавная после . ! ?
        result = capitalizeAfterPunctuation(result);

        return result;
      }

      // --- Отрисовка блоков ---
      function renderBlocks() {
        if (blocksData.length === 0) {
          blocksEl.innerHTML = '';
          updateButtons();
          return;
        }

        let html = '';
        blocksData.forEach((block, index) => {
          const isCollapsed = block.collapsed !== false;
          const isLive = block.live || false;
          const isFixed = block.fixed || false;
          const blockClass = `block ${isCollapsed ? 'collapsed' : 'expanded'} ${isLive ? 'live' : ''} ${isFixed ? 'fixed' : ''}`;
          html += `
            <div class="${blockClass}" data-index="${index}">
              <div class="block-text">${escapeHtml(block.text)}</div>
              <span class="block-time">${block.time}</span>
              <span class="swipe-hint left">← исправить</span>
              <span class="swipe-hint right">вернуть →</span>
            </div>
          `;
        });
        blocksEl.innerHTML = html;

        // --- События ---
        document.querySelectorAll('.block').forEach(el => {
          const idx = parseInt(el.dataset.index);

          // Клик = сворачивание/разворачивание (если не live-блок)
          el.addEventListener('click', function(e) {
            if (!blocksData[idx] || blocksData[idx].live) return;
            blocksData[idx].collapsed = !blocksData[idx].collapsed;
            renderBlocks();
            saveToStorage();
          });

          // Свайп
          el.addEventListener('touchstart', onTouchStart, { passive: true });
          el.addEventListener('touchmove', onTouchMove, { passive: false });
          el.addEventListener('touchend', onTouchEnd, { passive: true });
        });

        updateButtons();
        saveToStorage();
      }

      // --- Swipe-обработчики ---
      function onTouchStart(e) {
        const touch = e.touches[0];
        swipeState.startX = touch.clientX;
        swipeState.startY = touch.clientY;
        swipeState.isSwiping = false;
        swipeState.currentElement = this;
        swipeState.currentIndex = parseInt(this.dataset.index);
        this.classList.remove('swiping-left', 'swiping-right');
      }

      function onTouchMove(e) {
        if (!swipeState.currentElement) return;
        const touch = e.touches[0];
        const deltaX = touch.clientX - swipeState.startX;
        const deltaY = touch.clientY - swipeState.startY;

        if (Math.abs(deltaY) > Math.abs(deltaX) * 0.5) {
          swipeState.isSwiping = false;
          return;
        }

        swipeState.isSwiping = true;
        e.preventDefault();

        const el = swipeState.currentElement;
        const threshold = 60;

        if (deltaX < -threshold) {
          el.classList.add('swiping-left');
          el.classList.remove('swiping-right');
        } else if (deltaX > threshold) {
          el.classList.add('swiping-right');
          el.classList.remove('swiping-left');
        } else {
          el.classList.remove('swiping-left', 'swiping-right');
        }
      }

      function onTouchEnd(e) {
        if (!swipeState.currentElement) return;
        const el = swipeState.currentElement;
        const index = swipeState.currentIndex;

        el.classList.remove('swiping-left', 'swiping-right');

        if (!swipeState.isSwiping) {
          swipeState.isSwiping = false;
          swipeState.currentElement = null;
          return;
        }

        const touch = e.changedTouches[0];
        const deltaX = touch.clientX - swipeState.startX;
        const threshold = 50;

        if (deltaX < -threshold) {
          fixBlock(index);
        } else if (deltaX > threshold) {
          restoreBlock(index);
        }

        swipeState.isSwiping = false;
        swipeState.currentElement = null;
      }

      // --- Исправление блока через LanguageTool ---
      async function fixBlock(index) {
        const block = blocksData[index];
        if (!block || block.live) return;
        if (block.fixed) {
          showToast('Блок уже исправлен');
          return;
        }

        if (!block.originalText) {
          block.originalText = block.text;
        }

        const text = block.text;
        showToast('🔍 Исправление...');

        try {
          const response = await fetch('https://api.languagetool.org/v2/check', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({
              text: text,
              language: 'ru-RU',
              enabledOnly: 'false'
            })
          });

          const data = await response.json();

          let fixedText = text;
          if (data.matches && data.matches.length > 0) {
            const matches = data.matches.sort((a, b) => b.offset - a.offset);
            for (const match of matches) {
              if (match.replacements && match.replacements.length > 0) {
                const replacement = match.replacements[0].value;
                const start = match.offset;
                const end = match.offset + match.length;
                fixedText = fixedText.substring(0, start) + replacement + fixedText.substring(end);
              }
            }
          }

          fixedText = postProcessText(fixedText);

          if (fixedText !== text) {
            block.text = fixedText;
            block.fixed = true;
            renderBlocks();
            saveToStorage();
            showToast('✅ Блок исправлен');
          } else {
            showToast('ℹ️ Исправления не найдены');
          }
        } catch (error) {
          console.error('LanguageTool error:', error);
          showToast('❌ Ошибка при исправлении');
        }
      }

      // --- Восстановление оригинала ---
      function restoreBlock(index) {
        const block = blocksData[index];
        if (!block || block.live) return;
        if (!block.originalText || block.text === block.originalText) {
          showToast('ℹ️ Нет изменений для восстановления');
          return;
        }

        block.text = block.originalText;
        block.fixed = false;
        renderBlocks();
        saveToStorage();
        showToast('↩️ Восстановлен оригинал');
      }

      // --- Кнопки ---
      function updateButtons() {
        const hasBlocks = blocksData.filter(b => !b.live).length > 0;
        if (hasBlocks) {
          saveBtn.disabled = false;
          saveBtn.className = 'btn-save active';
          copyBtn.disabled = false;
          copyBtn.className = 'btn-copy active';
          clearBtn.disabled = false;
          clearBtn.className = 'btn-clear';
        } else {
          saveBtn.disabled = true;
          saveBtn.className = 'btn-save';
          copyBtn.disabled = true;
          copyBtn.className = 'btn-copy';
          clearBtn.disabled = true;
          clearBtn.className = 'btn-clear';
        }
      }

      // --- Добавление блока ---
      function addBlock(text, live = false) {
        if (!live && !text.trim()) return;
        if (live && text === undefined) text = ' ';

        const block = {
          text: text,
          time: live ? '...' : getFullTimestamp(),
          collapsed: !live,
          live: live,
          fixed: false,
          originalText: text
        };

        blocksData.push(block);
        renderBlocks();
        saveToStorage();
        return blocksData.length - 1;
      }

      // --- Обновление живого (оранжевого) блока ---
      function scrollToBottom() {
        setTimeout(() => {
          if (liveBlockIndex >= 0 && blocksData[liveBlockIndex]) {
            const el = document.querySelector(`.block[data-index="${liveBlockIndex}"] .block-text`);
            if (el) {
              el.scrollTop = el.scrollHeight;
            }
          }
        }, 50);
      }

      function updateLiveBlock() {
        if (liveBlockIndex >= 0 && blocksData[liveBlockIndex]) {
          blocksData[liveBlockIndex].text = accumulatedText || ' ';
          blocksData[liveBlockIndex].collapsed = false;
          renderBlocks();
          scrollToBottom();
        }
      }

      // --- Запись ---
      function startRec() {
        if (isRecording) return;

        if (!recognition) {
          recognition = new SpeechRecognition();
          recognition.lang = 'ru-RU';
          recognition.continuous = true;
          recognition.interimResults = false;

          recognition.onresult = function(e) {
            let text = '';
            for (let i = e.resultIndex; i < e.results.length; i++) {
              text += e.results[i][0].transcript;
            }
            if (!text.trim()) return;

            const tail = accumulatedText.slice(-20);
            if (tail.includes(text.trim()) && text.length < 30) {
              return;
            }

            if (accumulatedText) {
              accumulatedText += ' ' + text;
            } else {
              accumulatedText = text;
            }

            updateLiveBlock();
          };

          recognition.onsoundend = function() {
            if (accumulatedText && !accumulatedText.match(/[.!?]$/)) {
              accumulatedText += '.';
              accumulatedText = capitalizeAfterPunctuation(accumulatedText);
              updateLiveBlock();
            }
          };

          recognition.onerror = function(e) {
            if (e.error === 'not-allowed') {
              showToast('❌ Нет доступа к микрофону');
              stopRec();
            } else if (e.error === 'audio-capture') {
              showToast('❌ Микрофон недоступен');
              stopRec();
            }
          };

          recognition.onend = function() {
            if (isRecording && !recognition._manualStop) {
              clearTimeout(restartTimer);
              restartTimer = setTimeout(() => {
                if (isRecording) {
                  try { recognition.start(); } catch (_) {}
                }
              }, 300);
            } else {
              isRecording = false;
              recognition._manualStop = false;

              if (liveBlockIndex >= 0) {
                blocksData.splice(liveBlockIndex, 1);
                liveBlockIndex = -1;
              }

              if (accumulatedText.trim()) {
                const finalText = postProcessText(accumulatedText);
                addBlock(finalText, false);
                accumulatedText = '';
              }

              renderBlocks();
              recordBtn.textContent = '▶';
              recordBtn.className = 'btn-record';
            }
          };
        }

        isRecording = true;
        recognition._manualStop = false;
        accumulatedText = '';
        recordBtn.textContent = '■';
        recordBtn.className = 'btn-record active';

        if (liveBlockIndex === -1) {
          liveBlockIndex = addBlock(' ', true);
        }
        renderBlocks();
        scrollToBottom();

        try { recognition.start(); } catch (_) {}
      }

      function stopRec() {
        if (!isRecording) return;
        isRecording = false;
        if (recognition) {
          recognition._manualStop = true;
          clearTimeout(restartTimer);
          try { recognition.stop(); } catch (_) {}
        }
      }

      function toggleRec() {
        if (isRecording) stopRec();
        else startRec();
      }

      // --- Сохранение / копирование ---
      function getFullTextWithTimestamps() {
        const realBlocks = blocksData.filter(b => !b.live);
        if (realBlocks.length === 0) return '';
        return realBlocks.map(b => `${b.time}  ${b.text}`).join('\n\n');
      }

      function copyText() {
        const text = getFullTextWithTimestamps();
        if (!text) {
          showToast('❌ Нет текста');
          return;
        }
        navigator.clipboard.writeText(text).then(() => {
          showToast('✅ Скопировано в буфер');
        }).catch(() => {
          showToast('❌ Ошибка копирования');
        });
      }

      function saveFile() {
        const realBlocks = blocksData.filter(b => !b.live);
        if (realBlocks.length === 0) {
          showToast('❌ Нет текста');
          return;
        }

        const text = getFullTextWithTimestamps();

        const now = new Date();
        const pad = n => String(n).padStart(2, '0');
        const name = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate()) +
          '_' + pad(now.getHours()) + '-' + pad(now.getMinutes()) + '-' + pad(now.getSeconds()) + '.txt';

        try {
          if (navigator.share) {
            const file = new File([text], name, { type: 'text/plain' });
            navigator.share({ files: [file] }).then(() => {
              showToast('✅ Файл передан в "Поделиться"');
            }).catch(err => {
              if (err.name !== 'AbortError') showToast('❌ ' + err.message);
            });
          } else {
            const blob = new Blob([text], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = name;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            showToast('✅ Сохранено: ' + name);
          }
        } catch (e) {
          showToast('❌ Ошибка: ' + e.message);
        }
      }

      function clearAll() {
        const realBlocks = blocksData.filter(b => !b.live);
        if (realBlocks.length === 0) {
          showToast('Нет блоков для очистки');
          return;
        }
        if (confirm('Очистить все блоки?')) {
          blocksData = blocksData.filter(b => b.live);
          if (blocksData.length > 0 && blocksData[0].live) {
            blocksData[0].text = ' ';
            accumulatedText = '';
          }
          renderBlocks();
          localStorage.removeItem('blocks');
          showToast('🗑 Очищено');
        }
      }

      // --- Назначение событий ---
      recordBtn.addEventListener('click', toggleRec);
      saveBtn.addEventListener('click', saveFile);
      copyBtn.addEventListener('click', copyText);
      clearBtn.addEventListener('click', clearAll);

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
          e.preventDefault();
          toggleRec();
        }
        if (e.key === 'Escape' && isRecording) {
          e.preventDefault();
          stopRec();
        }
      });

      // --- Загрузка данных ---
      loadFromStorage();
      renderBlocks();
    })();
  </script>
</body>
</html>
