<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Диктофон</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .app {
      width: 100%;
      max-width: 600px;
      height: 100%;
      max-height: 700px;
      background: white;
      border-radius: 24px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .text {
      flex: 1;
      border: none;
      resize: none;
      font-size: 20px;
      line-height: 1.8;
      outline: none;
      font-family: inherit;
      padding: 10px 0;
    }
    .text::placeholder { color: #bbb; }
    .buttons {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding-top: 16px;
      border-top: 1px solid #eee;
    }
    .record-btn {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: none;
      font-size: 36px;
      cursor: pointer;
      background: #4CAF50;
      color: white;
      transition: 0.2s;
      box-shadow: 0 4px 12px rgba(76,175,80,0.3);
    }
    .record-btn:active { transform: scale(0.9); }
    .record-btn.active {
      background: #f44336;
      box-shadow: 0 4px 12px rgba(244,67,54,0.3);
    }
    .save-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: none;
      font-size: 28px;
      cursor: pointer;
      background: #e0e0e0;
      color: #999;
      transition: 0.2s;
    }
    .save-btn.active {
      background: #2196F3;
      color: white;
    }
    .save-btn:active { transform: scale(0.9); }
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      opacity: 0;
      transition: 0.3s;
      pointer-events: none;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="app">
    <textarea class="text" id="text" placeholder="Нажмите круглую кнопку и говорите..."></textarea>
    <div class="buttons">
      <button class="record-btn" id="record">▶</button>
      <button class="save-btn" id="save" disabled>💾</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    const text = document.getElementById('text');
    const record = document.getElementById('record');
    const save = document.getElementById('save');
    const toast = document.getElementById('toast');

    let isRecording = false;
    let finalText = '';
    let interimText = '';
    let recognition = null;
    let restartTimer = null;

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      toast.textContent = '❌ Браузер не поддерживает';
      toast.classList.add('show');
      record.disabled = true;
    }

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => toast.classList.remove('show'), 3000);
    }

    function updateUI() {
      if (isRecording) {
        record.textContent = '■';
        record.className = 'record-btn active';
        save.disabled = true;
        save.className = 'save-btn';
      } else {
        record.textContent = '▶';
        record.className = 'record-btn';
        if (finalText.trim()) {
          save.disabled = false;
          save.className = 'save-btn active';
        } else {
          save.disabled = true;
          save.className = 'save-btn';
        }
      }
      text.value = finalText + (interimText ? ' ' + interimText : '');
      text.scrollTop = text.scrollHeight;
    }

    function startRec() {
      if (isRecording) return;
      if (!recognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'ru-RU';
        recognition.continuous = true;
        recognition.interimResults = true;

        recognition.onresult = function(e) {
          let newFinal = '';
          let newInterim = '';
          for (let i = e.resultIndex; i < e.results.length; i++) {
            const r = e.results[i];
            if (r.isFinal) newFinal += r[0].transcript + ' ';
            else newInterim += r[0].transcript;
          }
          if (newFinal) {
            finalText += newFinal;
            interimText = '';
          } else {
            interimText = newInterim;
          }
          updateUI();
        };

        recognition.onerror = function(e) {
          if (e.error === 'not-allowed') {
            showToast('❌ Нет доступа к микрофону');
            stopRec();
          } else if (e.error === 'no-speech') {
            // игнорируем
          } else if (e.error === 'audio-capture') {
            showToast('❌ Микрофон недоступен');
            stopRec();
          }
        };

        recognition.onend = function() {
          if (isRecording && !recognition._manualStop) {
            clearTimeout(restartTimer);
            restartTimer = setTimeout(() => {
              if (isRecording) {
                try { recognition.start(); } catch(_) {}
              }
            }, 300);
          } else {
            isRecording = false;
            recognition._manualStop = false;
            updateUI();
          }
        };
      }

      isRecording = true;
      recognition._manualStop = false;
      updateUI();
      try { recognition.start(); } catch(_) {}
    }

    function stopRec() {
      isRecording = false;
      recognition._manualStop = true;
      clearTimeout(restartTimer);
      try { recognition.stop(); } catch(_) {}
      updateUI();
    }

    function toggleRec() {
      if (isRecording) stopRec();
      else startRec();
    }

    function saveFile() {
      const text = finalText.trim();
      if (!text) {
        showToast('❌ Нет текста');
        return;
      }

      const now = new Date();
      const pad = n => String(n).padStart(2, '0');
      const name = now.getFullYear() + '-' + pad(now.getMonth()+1) + '-' + pad(now.getDate()) +
        '_' + pad(now.getHours()) + '-' + pad(now.getMinutes()) + '-' + pad(now.getSeconds()) + '.txt';

      try {
        if (navigator.share) {
          const file = new File([text], name, { type: 'text/plain' });
          navigator.share({ files: [file] }).then(() => {
            showToast('✅ Файл передан в "Поделиться"');
          }).catch(err => {
            if (err.name !== 'AbortError') showToast('❌ ' + err.message);
          });
        } else {
          const blob = new Blob([text], { type: 'text/plain' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = name;
          a.click();
          showToast('✅ Сохранено: ' + name);
        }
        finalText = '';
        interimText = '';
        updateUI();
      } catch(e) {
        showToast('❌ Ошибка: ' + e.message);
      }
    }

    record.addEventListener('click', toggleRec);
    save.addEventListener('click', saveFile);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        toggleRec();
      }
      if (e.key === 'Escape' && isRecording) {
        e.preventDefault();
        stopRec();
      }
    });

    updateUI();
  </script>
</body>
</html>
