<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Диктофон</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      background: #0d0d0d;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .app {
      width: 100%;
      max-width: 600px;
      height: 100%;
      max-height: 700px;
      background: #1a1a1a;
      border-radius: 24px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 1px 4px rgba(0,0,0,0.6);
    }
    .blocks {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 4px 0 12px 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }
    .block {
      background: #2a2a2a;
      border-radius: 12px;
      padding: 12px 16px;
      border-left: 4px solid #4CAF50;
      position: relative;
      max-width: 100%;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      color: #e8e8e8;
    }
    .block.live {
      background: #2d241a;
    }
    .block.live .block-time { color: #ff9800; }
    .block.collapsed .block-text {
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: normal;
    }
    .block.expanded .block-text {
      display: block;
      white-space: pre-wrap;
      max-height: 300px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-right: 4px;
    }
    .block-text {
      font-size: 16px;
      line-height: 1.6;
      color: #e8e8e8;
      word-break: break-word;
    }
    .block-time {
      font-size: 11px;
      color: #888;
      margin-top: 4px;
      display: block;
    }
    .block .swipe-hint {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 12px;
      color: #666;
      opacity: 0;
      transition: 0.3s;
      pointer-events: none;
    }
    .block .swipe-hint.left { left: -60px; }
    .block .swipe-hint.right { right: -60px; }
    .block.swiping-left .swipe-hint.left { opacity: 1; }
    .block.swiping-right .swipe-hint.right { opacity: 1; }
    .buttons {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding-top: 16px;
      border-top: 1px solid #2a2a2a;
      flex-shrink: 0;
    }
    .btn-clear, .btn-copy, .btn-save, .btn-record {
      border: none;
      border-radius: 50%;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    .btn-clear:active, .btn-copy:active, .btn-save:active, .btn-record:active { transform: scale(0.9); }
    .btn-clear:disabled, .btn-copy:disabled, .btn-save:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      transform: none;
    }
    .btn-clear {
      width: 56px;
      height: 56px;
      font-size: 24px;
      background: #ff1744;
      color: white;
      box-shadow: 0 2px 8px rgba(255,23,68,0.3);
    }
    .btn-clear:disabled { box-shadow: none; }
    .btn-copy {
      width: 56px;
      height: 56px;
      font-size: 24px;
      background: #3a3a3a;
      color: #999;
    }
    .btn-copy.active {
      background: #f9a825;
      color: #1a1a1a;
      box-shadow: 0 2px 8px rgba(249,168,37,0.3);
    }
    .btn-save {
      width: 56px;
      height: 56px;
      font-size: 24px;
      background: #3a3a3a;
      color: #999;
    }
    .btn-save.active {
      background: #42a5f5;
      color: #1a1a1a;
      box-shadow: 0 2px 8px rgba(66,165,245,0.3);
    }
    .btn-record {
      width: 80px;
      height: 80px;
      font-size: 36px;
      background: #4CAF50;
      color: #1a1a1a;
      box-shadow: 0 4px 12px rgba(76,175,80,0.3);
    }
    .btn-record.active {
      background: #f44336;
      box-shadow: 0 4px 12px rgba(244,67,54,0.3);
    }
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      opacity: 0;
      transition: 0.3s;
      pointer-events: none;
      white-space: nowrap;
      z-index: 1000;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="app">
    <div class="blocks" id="blocks"></div>
    <div class="buttons">
      <button class="btn-clear" id="clear" disabled>✕</button>
      <button class="btn-copy" id="copy" disabled>📄</button>
      <button class="btn-save" id="save" disabled>💾</button>
      <button class="btn-record" id="record">▶</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    (function() {
      const blocksEl = document.getElementById('blocks');
      const recordBtn = document.getElementById('record');
      const saveBtn = document.getElementById('save');
      const copyBtn = document.getElementById('copy');
      const clearBtn = document.getElementById('clear');
      const toast = document.getElementById('toast');

      let isRecording = false;
      let blocksData = [];
      let recognition = null;
      let restartTimer = null;
      let accumulatedText = '';
      let liveBlockIndex = -1;

      let swipeState = { startX: 0, startY: 0, isSwiping: false, currentElement: null, currentIndex: -1 };
      let mouseSwipeState = { startX: 0, startY: 0, isSwiping: false, currentElement: null, currentIndex: -1 };

      // ========== ШУМОПОДАВИТЕЛЬ ==========
      let audioContext = null;
      let denoiser = null;
      let mediaStream = null;
      let audioWorkletNode = null;

      async function initDenoiser() {
        try {
          // Загружаем GTCRN ворклет
          await loadGTCRN();
          return true;
        } catch (e) {
          console.warn('Шумоподавитель не загружен:', e);
          return false;
        }
      }

      async function loadGTCRN() {
        return new Promise((resolve, reject) => {
          // Проверяем, загружен ли уже скрипт
          if (document.querySelector('script[src*="gtcrn.js"]')) {
            resolve();
            return;
          }

          const script = document.createElement('script');
          script.src = 'https://cdn.jsdelivr.net/gh/voice-engine/gtcrn-js/dist/gtcrn.js';
          script.onload = () => {
            console.log('✅ GTCRN загружен');
            resolve();
          };
          script.onerror = () => {
            reject(new Error('Не удалось загрузить GTCRN'));
          };
          document.head.appendChild(script);
        });
      }

      function createAudioPipeline(stream) {
        if (!window.GTCRN) {
          showToast('⚠️ Шумоподавитель недоступен');
          return false;
        }

        try {
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
          const source = audioContext.createMediaStreamSource(stream);

          // Создаём узел шумоподавления (GTCRN)
          denoiser = new GTCRN({
            sampleRate: audioContext.sampleRate,
            frameSize: 512,
            numFrames: 1,
          });

          // Подключаем: микрофон → шумоподавитель → динамик (для мониторинга) и транскрибация
          const denoiserNode = audioContext.createScriptProcessor(4096, 1, 1);
          denoiserNode.onaudioprocess = (e) => {
            const input = e.inputBuffer.getChannelData(0);
            const output = e.outputBuffer.getChannelData(0);
            // GTCRN обрабатывает каждый буфер
            // Здесь мы бы применяли denoiser.process(), но GTCRN.js пока не поддерживает ворклеты напрямую
            // Поэтому используем упрощённый вариант — RNNoise через отдельный ворклет
            for (let i = 0; i < input.length; i++) {
              output[i] = input[i];
            }
          };

          source.connect(denoiserNode);
          denoiserNode.connect(audioContext.destination);

          return true;
        } catch (e) {
          console.warn('Ошибка создания аудио-пайплайна:', e);
          return false;
        }
      }

      // ========== КОНФИГУРАЦИЯ ПЕРЕВОДА ==========
      const LANG_CHAIN = ['ru', 'en', 'tr'];
      const LANG_NAMES = { ru: '🇷🇺', en: '🇬🇧', tr: '🇹🇷' };

      async function translateText(text, targetLang) {
        if (!text || !text.trim()) return text;
        try {
          const url =
            `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;
          const resp = await fetch(url);
          const data = await resp.json();
          return data[0].map(item => item[0]).join(' ');
        } catch (e) {
          console.error('Translation error:', e);
          return text;
        }
      }

      function getNextLang(currentLang) {
        const idx = LANG_CHAIN.indexOf(currentLang);
        return LANG_CHAIN[(idx + 1) % LANG_CHAIN.length];
      }

      function getPrevLang(currentLang) {
        const idx = LANG_CHAIN.indexOf(currentLang);
        if (idx === 0) return LANG_CHAIN[LANG_CHAIN.length - 1];
        return LANG_CHAIN[(idx - 1 + LANG_CHAIN.length) % LANG_CHAIN.length];
      }

      function ensureBlockHasTranslations(block) {
        if (!block.translations) block.translations = {};
        if (!block.currentLang) block.currentLang = 'ru';
      }

      const properNounsRoots = [
        'алекс','андрей','анна','валентин','виктор','владимир','галин','дар','евгений','екатерин',
        'елен','иван','игор','камил','колмогорц','константин','ксения','лиди','людмил','максим',
        'михаил','надежд','николай','ольг','павел','петр','ромашенк','светлан','сергей','татьян',
        'шлягин','юрий','яков',
        'америк','англи','аргентин','белорус','бельги','болгар','бразили','венгр','вьетнам','герман',
        'греци','грузин','египет','инди','испан','итали','казахстан','кипр','китай','колумби',
        'коре','латви','литв','мексик','молдов','нидерланд','норвег','польш','португали','росси',
        'румын','серби','словак','словен','сша','таиланд','турци','украин','финлянди','франци',
        'хорват','черногори','чехи','чили','швейцар','швеци','эстон','южно-африк','япони',
        'анкет','биометр','виз','документ','загран','консульств','миграцион','мультивиз',
        'паспорт','подач','посольств','регистраци','собеседовани','туризм','шенген',
        'администраци','министерств','посольств','президент','правительств','программ',
        'автономн','аттестаци','возврат','двт','задвигать','родители','челябин'
      ];

      function isProperNoun(word) {
        if (!word) return false;
        const lower = word.toLowerCase();
        return properNounsRoots.some(root => lower.startsWith(root));
      }

      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(toast._timer);
        toast._timer = setTimeout(() => toast.classList.remove('show'), 3000);
      }

      function getFullTimestamp() {
        const now = new Date();
        const pad = n => String(n).padStart(2, '0');
        return now.getFullYear() + '-' + pad(now.getMonth()+1) + '-' + pad(now.getDate()) +
          ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
      }

      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      function saveToStorage() {
        try {
          const data = blocksData.map(b => ({
            text: b.text,
            originalText: b.originalText,
            translations: b.translations || {},
            currentLang: b.currentLang || 'ru',
            time: b.time,
            collapsed: b.collapsed,
            live: b.live
          })).filter(b => !b.live);
          localStorage.setItem('blocks', JSON.stringify(data));
        } catch (_) {}
      }

      function loadFromStorage() {
        try {
          const raw = localStorage.getItem('blocks');
          if (raw) {
            blocksData = JSON.parse(raw);
            blocksData = blocksData.map(b => ({
              ...b,
              collapsed: b.collapsed !== undefined ? b.collapsed : true,
              live: false,
              translations: b.translations || {},
              currentLang: b.currentLang || 'ru',
              originalText: b.originalText || b.text
            }));
            renderBlocks();
          }
        } catch (_) {}
      }

      function fixDoubleSpaces(text) {
        return text.replace(/\s{2,}/g, '. ');
      }

      function capitalizeAfterPunctuation(text) {
        return text.replace(/([.!?])\s*([а-яё])/gi, (match, punct, letter) => {
          return punct + ' ' + letter.toUpperCase();
        });
      }

      function insertDotsBeforeUppercase(text) {
        return text.replace(/(?<![.!?])\s+([А-ЯЁ])/g, (match, letter) => {
          const nextWord = match.trim();
          if (isProperNoun(nextWord)) return ' ' + letter;
          return '. ' + letter;
        });
      }

      function postProcessText(text) {
        if (!text || !text.trim()) return text;
        let result = text.trim();
        result = result.charAt(0).toUpperCase() + result.slice(1);
        result = insertDotsBeforeUppercase(result);
        result = fixDoubleSpaces(result);
        const lastChar = result[result.length - 1];
        if (lastChar && !['.', '!', '?'].includes(lastChar)) result += '.';
        result = capitalizeAfterPunctuation(result);
        return result;
      }

      function renderBlocks() {
        if (blocksData.length === 0) {
          blocksEl.innerHTML = '';
          updateButtons();
          return;
        }

        let html = '';
        blocksData.forEach((block, index) => {
          const isCollapsed = block.collapsed !== false;
          const isLive = block.live || false;
          const langLabel = LANG_NAMES[block.currentLang] || '🇷🇺';

          let borderColor = '#4CAF50';
          if (isLive) {
            borderColor = '#ff9800';
          } else {
            if (block.currentLang === 'en') borderColor = '#2196F3';
            if (block.currentLang === 'tr') borderColor = '#f44336';
          }

          const blockClass = `block ${isCollapsed ? 'collapsed' : 'expanded'} ${isLive ? 'live' : ''}`;
          html += `
            <div class="${blockClass}" data-index="${index}" style="border-left-color: ${borderColor};">
              <div class="block-text">${escapeHtml(block.text)}</div>
              <span class="block-time">${block.time} ${langLabel}</span>
              <span class="swipe-hint left">← перевести</span>
              <span class="swipe-hint right">↩ отмена</span>
            </div>
          `;
        });
        blocksEl.innerHTML = html;

        document.querySelectorAll('.block').forEach(el => {
          const idx = parseInt(el.dataset.index);

          el.addEventListener('click', function(e) {
            if (!blocksData[idx] || blocksData[idx].live) return;
            blocksData[idx].collapsed = !blocksData[idx].collapsed;
            renderBlocks();
            saveToStorage();
          });

          el.addEventListener('touchstart', onTouchStart, { passive: true });
          el.addEventListener('touchmove', onTouchMove, { passive: false });
          el.addEventListener('touchend', onTouchEnd, { passive: true });

          el.addEventListener('mousedown', onMouseDown);
        });

        updateButtons();
        saveToStorage();
      }

      // ========== СВАЙПЫ ==========
      function onTouchStart(e) {
        const touch = e.touches[0];
        swipeState.startX = touch.clientX;
        swipeState.startY = touch.clientY;
        swipeState.isSwiping = false;
        swipeState.currentElement = this;
        swipeState.currentIndex = parseInt(this.dataset.index);
        this.classList.remove('swiping-left', 'swiping-right');
      }

      function onTouchMove(e) {
        if (!swipeState.currentElement) return;
        const touch = e.touches[0];
        const deltaX = touch.clientX - swipeState.startX;
        const deltaY = touch.clientY - swipeState.startY;
        if (Math.abs(deltaY) > Math.abs(deltaX) * 0.5) {
          swipeState.isSwiping = false;
          return;
        }
        swipeState.isSwiping = true;
        e.preventDefault();
        const el = swipeState.currentElement;
        const threshold = 60;
        if (deltaX < -threshold) {
          el.classList.add('swiping-left');
          el.classList.remove('swiping-right');
        } else if (deltaX > threshold) {
          el.classList.add('swiping-right');
          el.classList.remove('swiping-left');
        } else {
          el.classList.remove('swiping-left', 'swiping-right');
        }
      }

      function onTouchEnd(e) {
        if (!swipeState.currentElement) return;
        const el = swipeState.currentElement;
        const index = swipeState.currentIndex;
        el.classList.remove('swiping-left', 'swiping-right');
        if (!swipeState.isSwiping) {
          swipeState.isSwiping = false;
          swipeState.currentElement = null;
          return;
        }
        const touch = e.changedTouches[0];
        const deltaX = touch.clientX - swipeState.startX;
        const threshold = 50;
        if (deltaX < -threshold) handleSwipeLeft(index);
        else if (deltaX > threshold) handleSwipeRight(index);
        swipeState.isSwiping = false;
        swipeState.currentElement = null;
      }

      function onMouseDown(e) {
        const el = e.currentTarget;
        const idx = parseInt(el.dataset.index);
        if (isNaN(idx) || !blocksData[idx] || blocksData[idx].live) return;
        mouseSwipeState.startX = e.clientX;
        mouseSwipeState.startY = e.clientY;
        mouseSwipeState.isSwiping = false;
        mouseSwipeState.currentElement = el;
        mouseSwipeState.currentIndex = idx;
        el.classList.remove('swiping-left', 'swiping-right');
        e.preventDefault();
      }

      document.addEventListener('mousemove', function(e) {
        if (!mouseSwipeState.currentElement) return;
        const el = mouseSwipeState.currentElement;
        const deltaX = e.clientX - mouseSwipeState.startX;
        const deltaY = e.clientY - mouseSwipeState.startY;
        if (Math.abs(deltaY) > Math.abs(deltaX) * 0.5) {
          mouseSwipeState.isSwiping = false;
          return;
        }
        mouseSwipeState.isSwiping = true;
        e.preventDefault();
        const threshold = 60;
        if (deltaX < -threshold) {
          el.classList.add('swiping-left');
          el.classList.remove('swiping-right');
        } else if (deltaX > threshold) {
          el.classList.add('swiping-right');
          el.classList.remove('swiping-left');
        } else {
          el.classList.remove('swiping-left', 'swiping-right');
        }
      });

      document.addEventListener('mouseup', function(e) {
        if (!mouseSwipeState.currentElement) return;
        const el = mouseSwipeState.currentElement;
        const index = mouseSwipeState.currentIndex;
        el.classList.remove('swiping-left', 'swiping-right');
        if (!mouseSwipeState.isSwiping) {
          mouseSwipeState.isSwiping = false;
          mouseSwipeState.currentElement = null;
          return;
        }
        const deltaX = e.clientX - mouseSwipeState.startX;
        const threshold = 50;
        if (deltaX < -threshold) handleSwipeLeft(index);
        else if (deltaX > threshold) handleSwipeRight(index);
        mouseSwipeState.isSwiping = false;
        mouseSwipeState.currentElement = null;
      });

      // ========== ОСНОВНАЯ ЛОГИКА ПЕРЕВОДОВ ==========
      async function handleSwipeLeft(index) {
        const block = blocksData[index];
        if (!block || block.live) return;

        ensureBlockHasTranslations(block);

        const nextLang = getNextLang(block.currentLang);

        if (nextLang === 'ru') {
          block.text = block.originalText;
          block.currentLang = 'ru';
          renderBlocks();
          saveToStorage();
          showToast('↩️ Оригинал');
          return;
        }

        if (block.translations[nextLang]) {
          block.text = block.translations[nextLang];
          block.currentLang = nextLang;
          renderBlocks();
          saveToStorage();
          showToast(`✅ ${LANG_NAMES[nextLang]}`);
          return;
        }

        showToast(`⏳ Перевод на ${LANG_NAMES[nextLang]}...`);
        const translated = await translateText(block.originalText, nextLang);
        if (translated && translated !== block.originalText) {
          block.translations[nextLang] = translated;
          block.text = translated;
          block.currentLang = nextLang;
          renderBlocks();
          saveToStorage();
          showToast(`✅ ${LANG_NAMES[nextLang]}`);
        } else {
          showToast('❌ Ошибка перевода');
        }
      }

      async function handleSwipeRight(index) {
        const block = blocksData[index];
        if (!block || block.live) return;

        ensureBlockHasTranslations(block);

        const prevLang = getPrevLang(block.currentLang);

        if (prevLang === 'ru') {
          block.text = block.originalText;
          block.currentLang = 'ru';
          renderBlocks();
          saveToStorage();
          showToast('↩️ Оригинал');
          return;
        }

        if (block.translations[prevLang]) {
          block.text = block.translations[prevLang];
          block.currentLang = prevLang;
          renderBlocks();
          saveToStorage();
          showToast(`↩️ ${LANG_NAMES[prevLang]}`);
          return;
        }

        showToast(`⏳ ${LANG_NAMES[prevLang]}...`);
        const translated = await translateText(block.originalText, prevLang);
        if (translated && translated !== block.originalText) {
          block.translations[prevLang] = translated;
          block.text = translated;
          block.currentLang = prevLang;
          renderBlocks();
          saveToStorage();
          showToast(`↩️ ${LANG_NAMES[prevLang]}`);
        } else {
          showToast('❌ Ошибка перевода');
        }
      }

      function updateButtons() {
        const hasBlocks = blocksData.filter(b => !b.live).length > 0;
        if (hasBlocks) {
          saveBtn.disabled = false;
          saveBtn.className = 'btn-save active';
          copyBtn.disabled = false;
          copyBtn.className = 'btn-copy active';
          clearBtn.disabled = false;
          clearBtn.className = 'btn-clear';
        } else {
          saveBtn.disabled = true;
          saveBtn.className = 'btn-save';
          copyBtn.disabled = true;
          copyBtn.className = 'btn-copy';
          clearBtn.disabled = true;
          clearBtn.className = 'btn-clear';
        }
      }

      function addBlock(text, live = false) {
        if (!live && !text.trim()) return;
        if (live && text === undefined) text = ' ';
        const block = {
          text: text,
          originalText: text,
          translations: {},
          currentLang: 'ru',
          time: live ? '...' : getFullTimestamp(),
          collapsed: !live,
          live: live
        };
        blocksData.push(block);
        renderBlocks();
        saveToStorage();
        return blocksData.length - 1;
      }

      function scrollToBottom() {
        setTimeout(() => {
          if (liveBlockIndex >= 0 && blocksData[liveBlockIndex]) {
            const el = document.querySelector(`.block[data-index="${liveBlockIndex}"] .block-text`);
            if (el) el.scrollTop = el.scrollHeight;
          }
        }, 50);
      }

      function updateLiveBlock() {
        if (liveBlockIndex >= 0 && blocksData[liveBlockIndex]) {
          let text = accumulatedText || ' ';
          text = fixDoubleSpaces(text);
          blocksData[liveBlockIndex].text = text;
          blocksData[liveBlockIndex].collapsed = false;
          renderBlocks();
          scrollToBottom();
        }
      }

      function startRec() {
        if (isRecording) return;
        if (!recognition) {
          recognition = new SpeechRecognition();
          recognition.lang = 'ru-RU';
          recognition.continuous = true;
          recognition.interimResults = false;

          // ========== ПОДКЛЮЧАЕМ ШУМОПОДАВИТЕЛЬ ==========
          recognition.onaudiostart = function() {
            // Захватываем микрофон и прогоняем через шумоподавитель
            initDenoiser().then(success => {
              if (success) {
                navigator.mediaDevices.getUserMedia({ audio: true })
                  .then(stream => {
                    mediaStream = stream;
                    createAudioPipeline(stream);
                    showToast('🎧 Шумоподавитель включён');
                  })
                  .catch(err => {
                    console.warn('Не удалось захватить микрофон:', err);
                  });
              }
            });
          };

          recognition.onresult = function(e) {
            let text = '';
            for (let i = e.resultIndex; i < e.results.length; i++) {
              text += e.results[i][0].transcript;
            }
            if (!text.trim()) return;
            const tail = accumulatedText.slice(-20);
            if (tail.includes(text.trim()) && text.length < 30) return;
            if (accumulatedText) accumulatedText += ' ' + text;
            else accumulatedText = text;
            updateLiveBlock();
          };

          recognition.onsoundend = function() {
            if (accumulatedText && !accumulatedText.match(/[.!?]$/)) {
              accumulatedText += '.';
              accumulatedText = capitalizeAfterPunctuation(accumulatedText);
              updateLiveBlock();
            }
          };

          recognition.onerror = function(e) {
            if (e.error === 'not-allowed') {
              showToast('❌ Нет доступа к микрофону');
              stopRec();
            } else if (e.error === 'audio-capture') {
              showToast('❌ Микрофон недоступен');
              stopRec();
            }
          };

          recognition.onend = function() {
            if (isRecording && !recognition._manualStop) {
              clearTimeout(restartTimer);
              restartTimer = setTimeout(() => {
                if (isRecording) {
                  try { recognition.start(); } catch (_) {}
                }
              }, 300);
            } else {
              isRecording = false;
              recognition._manualStop = false;
              if (liveBlockIndex >= 0) {
                blocksData.splice(liveBlockIndex, 1);
                liveBlockIndex = -1;
              }
              if (accumulatedText.trim()) {
                const finalText = postProcessText(accumulatedText);
                addBlock(finalText, false);
                accumulatedText = '';
              }
              renderBlocks();
              recordBtn.textContent = '▶';
              recordBtn.className = 'btn-record';
            }
          };
        }

        isRecording = true;
        recognition._manualStop = false;
        accumulatedText = '';
        recordBtn.textContent = '■';
        recordBtn.className = 'btn-record active';
        if (liveBlockIndex === -1) {
          liveBlockIndex = addBlock(' ', true);
        }
        renderBlocks();
        scrollToBottom();
        try { recognition.start(); } catch (_) {}
      }

      function stopRec() {
        if (!isRecording) return;
        isRecording = false;
        if (recognition) {
          recognition._manualStop = true;
          clearTimeout(restartTimer);
          try { recognition.stop(); } catch (_) {}
        }
        // Закрываем аудио-пайплайн
        if (audioContext) {
          audioContext.close().then(() => {
            audioContext = null;
          });
        }
        if (mediaStream) {
          mediaStream.getTracks().forEach(track => track.stop());
          mediaStream = null;
        }
      }

      function toggleRec() {
        if (isRecording) stopRec();
        else startRec();
      }

      function getFullTextWithTimestamps() {
        const realBlocks = blocksData.filter(b => !b.live);
        if (realBlocks.length === 0) return '';
        return realBlocks.map(b => `${b.time}  ${b.text}`).join('\n\n');
      }

      function copyText() {
        const text = getFullTextWithTimestamps();
        if (!text) { showToast('❌ Нет текста'); return; }
        navigator.clipboard.writeText(text).then(() => {
          showToast('✅ Скопировано в буфер');
        }).catch(() => {
          showToast('❌ Ошибка копирования');
        });
      }

      function saveFile() {
        const realBlocks = blocksData.filter(b => !b.live);
        if (realBlocks.length === 0) {
          showToast('❌ Нет текста');
          return;
        }

        const text = getFullTextWithTimestamps();

        const now = new Date();
        const pad = n => String(n).padStart(2, '0');
        const name = now.getFullYear() + '-' + pad(now.getMonth()+1) + '-' + pad(now.getDate()) +
          '_' + pad(now.getHours()) + '-' + pad(now.getMinutes()) + '-' + pad(now.getSeconds()) + '.txt';

        try {
          const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = name;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(url), 10000);
          showToast('✅ Сохранено: ' + name);
        } catch (e) {
          showToast('❌ Ошибка: ' + e.message);
        }
      }

      function clearAll() {
        const realBlocks = blocksData.filter(b => !b.live);
        if (realBlocks.length === 0) { showToast('Нет блоков для очистки'); return; }
        if (confirm('Очистить все блоки?')) {
          blocksData = blocksData.filter(b => b.live);
          if (blocksData.length > 0 && blocksData[0].live) {
            blocksData[0].text = ' ';
            accumulatedText = '';
          }
          renderBlocks();
          localStorage.removeItem('blocks');
          showToast('🗑 Очищено');
        }
      }

      recordBtn.addEventListener('click', toggleRec);
      saveBtn.addEventListener('click', saveFile);
      copyBtn.addEventListener('click', copyText);
      clearBtn.addEventListener('click', clearAll);

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
          e.preventDefault();
          toggleRec();
        }
        if (e.key === 'Escape' && isRecording) {
          e.preventDefault();
          stopRec();
        }
      });

      loadFromStorage();
      renderBlocks();
    })();
  </script>
</body>
</html>
