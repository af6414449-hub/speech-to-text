<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Диктофон</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .app {
      width: 100%;
      max-width: 600px;
      height: 100%;
      max-height: 700px;
      background: white;
      border-radius: 24px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .text {
      flex: 1;
      border: none;
      resize: none;
      font-size: 20px;
      line-height: 1.8;
      outline: none;
      font-family: inherit;
      padding: 10px 0;
    }
    .text::placeholder { color: #bbb; }
    .buttons {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding-top: 16px;
      border-top: 1px solid #eee;
    }
    .btn-clear {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: none;
      font-size: 24px;
      cursor: pointer;
      background: #ffebee;
      color: #c62828;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-clear:active { transform: scale(0.9); }
    .btn-clear:disabled { opacity: 0.3; cursor: not-allowed; }
    .btn-save {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: none;
      font-size: 24px;
      cursor: pointer;
      background: #e0e0e0;
      color: #999;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-save:active { transform: scale(0.9); }
    .btn-save.active {
      background: #2196F3;
      color: white;
    }
    .btn-save:disabled { opacity: 0.3; cursor: not-allowed; }
    .btn-record {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: none;
      font-size: 36px;
      cursor: pointer;
      background: #4CAF50;
      color: white;
      transition: 0.2s;
      box-shadow: 0 4px 12px rgba(76,175,80,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-record:active { transform: scale(0.9); }
    .btn-record.active {
      background: #f44336;
      box-shadow: 0 4px 12px rgba(244,67,54,0.3);
    }
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      opacity: 0;
      transition: 0.3s;
      pointer-events: none;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="app">
    <textarea class="text" id="text" placeholder="Нажмите ▶ и говорите..."></textarea>
    <div class="buttons">
      <button class="btn-clear" id="clear" disabled>✕</button>
      <button class="btn-save" id="save" disabled>💾</button>
      <button class="btn-record" id="record">▶</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    (function() {
      const text = document.getElementById('text');
      const record = document.getElementById('record');
      const save = document.getElementById('save');
      const clear = document.getElementById('clear');
      const toast = document.getElementById('toast');

      let isRecording = false;
      let finalText = '';
      let interimText = '';
      let recognition = null;
      let restartTimer = null;
      let lastText = '';

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        toast.textContent = '❌ Браузер не поддерживает';
        toast.classList.add('show');
        record.disabled = true;
        return;
      }

      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(toast._timer);
        toast._timer = setTimeout(() => toast.classList.remove('show'), 3000);
      }

      function updateUI() {
        // Кнопка записи
        if (isRecording) {
          record.textContent = '■';
          record.className = 'btn-record active';
        } else {
          record.textContent = '▶';
          record.className = 'btn-record';
        }

        // Текст
        const display = finalText + (interimText ? ' ' + interimText : '');
        if (text.value !== display) {
          text.value = display;
          text.scrollTop = text.scrollHeight;
        }

        // Кнопки Сохранить и Очистить
        const hasText = finalText.trim().length > 0;
        if (hasText) {
          save.disabled = false;
          save.className = 'btn-save active';
          clear.disabled = false;
          clear.className = 'btn-clear';
        } else {
          save.disabled = true;
          save.className = 'btn-save';
          clear.disabled = true;
          clear.className = 'btn-clear';
        }
      }

      function startRec() {
        if (isRecording) return;
        if (!recognition) {
          recognition = new SpeechRecognition();
          recognition.lang = 'ru-RU';
          recognition.continuous = true;
          recognition.interimResults = true;

          recognition.onresult = function(e) {
            let newFinal = '';
            let newInterim = '';

            for (let i = e.resultIndex; i < e.results.length; i++) {
              const r = e.results[i];
              const chunk = r[0].transcript;
              if (r.isFinal) {
                newFinal += chunk + ' ';
              } else {
                newInterim += chunk;
              }
            }

            // Android фикс: добавляем только если текст реально новый
            if (newFinal) {
              // Проверяем, не заканчивается ли уже finalText на этот текст
              if (!finalText.endsWith(newFinal)) {
                finalText += newFinal;
              }
              interimText = '';
            } else if (newInterim) {
              interimText = newInterim;
            }

            updateUI();
          };

          recognition.onerror = function(e) {
            if (e.error === 'not-allowed') {
              showToast('❌ Нет доступа к микрофону');
              stopRec();
            } else if (e.error === 'no-speech') {
              // игнорируем
            } else if (e.error === 'audio-capture') {
              showToast('❌ Микрофон недоступен');
              stopRec();
            }
          };

          recognition.onend = function() {
            if (isRecording && !recognition._manualStop) {
              clearTimeout(restartTimer);
              restartTimer = setTimeout(() => {
                if (isRecording) {
                  try { recognition.start(); } catch(_) {}
                }
              }, 300);
            } else {
              isRecording = false;
              recognition._manualStop = false;
              updateUI();
            }
          };
        }

        isRecording = true;
        recognition._manualStop = false;
        updateUI();
        try { recognition.start(); } catch(_) {}
      }

      function stopRec() {
        isRecording = false;
        if (recognition) {
          recognition._manualStop = true;
          clearTimeout(restartTimer);
          try { recognition.stop(); } catch(_) {}
        }
        updateUI();
      }

      function toggleRec() {
        if (isRecording) stopRec();
        else startRec();
      }

      function saveFile() {
        const textContent = finalText.trim();
        if (!textContent) {
          showToast('❌ Нет текста');
          return;
        }

        const now = new Date();
        const pad = n => String(n).padStart(2, '0');
        const name = now.getFullYear() + '-' + pad(now.getMonth()+1) + '-' + pad(now.getDate()) +
          '_' + pad(now.getHours()) + '-' + pad(now.getMinutes()) + '-' + pad(now.getSeconds()) + '.txt';

        try {
          if (navigator.share) {
            const file = new File([textContent], name, { type: 'text/plain' });
            navigator.share({ files: [file] }).then(() => {
              showToast('✅ Файл передан в "Поделиться"');
            }).catch(err => {
              if (err.name !== 'AbortError') showToast('❌ ' + err.message);
            });
          } else {
            const blob = new Blob([textContent], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = name;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            showToast('✅ Сохранено: ' + name);
          }
        } catch(e) {
          showToast('❌ Ошибка: ' + e.message);
        }
      }

      function clearText() {
        if (!finalText.trim()) return;
        finalText = '';
        interimText = '';
        updateUI();
        showToast('🗑 Очищено');
      }

      // --- События ---
      record.addEventListener('click', toggleRec);
      save.addEventListener('click', saveFile);
      clear.addEventListener('click', clearText);

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
          e.preventDefault();
          toggleRec();
        }
        if (e.key === 'Escape' && isRecording) {
          e.preventDefault();
          stopRec();
        }
      });

      updateUI();
    })();
  </script>
</body>
</html>
