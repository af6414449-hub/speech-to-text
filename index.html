<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Диктофон</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .app {
      width: 100%;
      max-width: 600px;
      height: 100%;
      max-height: 700px;
      background: white;
      border-radius: 24px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .blocks {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0 12px 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .block {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 12px 16px;
      cursor: pointer;
      transition: 0.2s;
      border-left: 4px solid #4CAF50;
    }
    .block:active { background: #e9ecef; }
    .block.collapsed .block-text { 
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: normal;
    }
    .block.expanded .block-text {
      display: block;
      white-space: pre-wrap;
    }
    .block-text {
      font-size: 16px;
      line-height: 1.6;
      color: #1a1a1a;
      word-break: break-word;
    }
    .block-time {
      font-size: 11px;
      color: #999;
      margin-top: 4px;
      display: block;
    }
    .empty-state {
      color: #bbb;
      text-align: center;
      font-size: 16px;
      margin-top: 40px;
    }
    .buttons {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding-top: 16px;
      border-top: 1px solid #eee;
      flex-shrink: 0;
    }
    .btn-clear {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: none;
      font-size: 24px;
      cursor: pointer;
      background: #ffebee;
      color: #c62828;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-clear:active { transform: scale(0.9); }
    .btn-clear:disabled { opacity: 0.3; cursor: not-allowed; }
    .btn-save {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: none;
      font-size: 24px;
      cursor: pointer;
      background: #e0e0e0;
      color: #999;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-save:active { transform: scale(0.9); }
    .btn-save.active {
      background: #2196F3;
      color: white;
    }
    .btn-save:disabled { opacity: 0.3; cursor: not-allowed; }
    .btn-record {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: none;
      font-size: 36px;
      cursor: pointer;
      background: #4CAF50;
      color: white;
      transition: 0.2s;
      box-shadow: 0 4px 12px rgba(76,175,80,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-record:active { transform: scale(0.9); }
    .btn-record.active {
      background: #f44336;
      box-shadow: 0 4px 12px rgba(244,67,54,0.3);
    }
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      opacity: 0;
      transition: 0.3s;
      pointer-events: none;
      white-space: nowrap;
      z-index: 1000;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="app">
    <div class="blocks" id="blocks">
      <div class="empty-state">Нажмите ▶ и говорите</div>
    </div>
    <div class="buttons">
      <button class="btn-clear" id="clear" disabled>✕</button>
      <button class="btn-save" id="save" disabled>💾</button>
      <button class="btn-record" id="record">▶</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    (function() {
      const blocks = document.getElementById('blocks');
      const record = document.getElementById('record');
      const save = document.getElementById('save');
      const clear = document.getElementById('clear');
      const toast = document.getElementById('toast');

      let isRecording = false;
      let currentText = '';
      let blocksData = [];
      let recognition = null;
      let restartTimer = null;
      let blockCounter = 0;

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        toast.textContent = '❌ Браузер не поддерживает';
        toast.classList.add('show');
        record.disabled = true;
        return;
      }

      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(toast._timer);
        toast._timer = setTimeout(() => toast.classList.remove('show'), 3000);
      }

      function getTime() {
        const now = new Date();
        const pad = n => String(n).padStart(2, '0');
        return pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
      }

      function renderBlocks() {
        if (blocksData.length === 0) {
          blocks.innerHTML = '<div class="empty-state">Нажмите ▶ и говорите</div>';
          updateButtons();
          return;
        }

        let html = '';
        blocksData.forEach((block, index) => {
          const isCollapsed = block.collapsed !== false;
          html += `
            <div class="block ${isCollapsed ? 'collapsed' : 'expanded'}" data-index="${index}">
              <div class="block-text">${escapeHtml(block.text)}</div>
              <span class="block-time">${block.time}</span>
            </div>
          `;
        });
        blocks.innerHTML = html;

        // Клик по блоку — переключение
        document.querySelectorAll('.block').forEach(el => {
          el.addEventListener('click', function(e) {
            const idx = parseInt(this.dataset.index);
            if (!isNaN(idx) && blocksData[idx]) {
              blocksData[idx].collapsed = !blocksData[idx].collapsed;
              renderBlocks();
            }
          });
        });

        updateButtons();
        blocks.scrollTop = blocks.scrollHeight;
      }

      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      function updateButtons() {
        const hasBlocks = blocksData.length > 0;
        if (hasBlocks) {
          save.disabled = false;
          save.className = 'btn-save active';
          clear.disabled = false;
          clear.className = 'btn-clear';
        } else {
          save.disabled = true;
          save.className = 'btn-save';
          clear.disabled = true;
          clear.className = 'btn-clear';
        }
      }

      function addBlock(text) {
        if (!text.trim()) return;
        blocksData.push({
          text: text.trim(),
          time: getTime(),
          collapsed: true
        });
        currentText = '';
        renderBlocks();
      }

      function startRec() {
        if (isRecording) return;
        if (!recognition) {
          recognition = new SpeechRecognition();
          recognition.lang = 'ru-RU';
          recognition.continuous = true;
          recognition.interimResults = true;

          recognition.onresult = function(e) {
            let newFinal = '';
            let newInterim = '';

            for (let i = e.resultIndex; i < e.results.length; i++) {
              const r = e.results[i];
              const chunk = r[0].transcript;
              if (r.isFinal) {
                newFinal += chunk + ' ';
              } else {
                newInterim += chunk;
              }
            }

            if (newFinal) {
              if (!currentText.endsWith(newFinal)) {
                currentText += newFinal;
              }
            } else if (newInterim) {
              // Показываем промежуточный текст во время записи
              const displayText = currentText + (currentText ? ' ' : '') + newInterim;
              // Временно показываем в отдельном блоке
              showTempBlock(displayText);
            }
          };

          recognition.onerror = function(e) {
            if (e.error === 'not-allowed') {
              showToast('❌ Нет доступа к микрофону');
              stopRec();
            } else if (e.error === 'audio-capture') {
              showToast('❌ Микрофон недоступен');
              stopRec();
            }
          };

          recognition.onend = function() {
            if (isRecording && !recognition._manualStop) {
              clearTimeout(restartTimer);
              restartTimer = setTimeout(() => {
                if (isRecording) {
                  try { recognition.start(); } catch(_) {}
                }
              }, 300);
            } else {
              isRecording = false;
              recognition._manualStop = false;
              // Сохраняем текущий текст как блок
              if (currentText.trim()) {
                addBlock(currentText);
              }
              renderBlocks();
            }
          };
        }

        isRecording = true;
        recognition._manualStop = false;
        record.textContent = '■';
        record.className = 'btn-record active';
        try { recognition.start(); } catch(_) {}
      }

      function showTempBlock(text) {
        // Временно показываем промежуточный текст
        if (blocksData.length === 0 || !blocksData[blocksData.length-1]._temp) {
          blocksData.push({
            text: text,
            time: '...',
            collapsed: false,
            _temp: true
          });
        } else {
          blocksData[blocksData.length-1].text = text;
        }
        renderBlocks();
      }

      function stopRec() {
        isRecording = false;
        if (recognition) {
          recognition._manualStop = true;
          clearTimeout(restartTimer);
          try { recognition.stop(); } catch(_) {}
        }
        record.textContent = '▶';
        record.className = 'btn-record';
        
        // Убираем временный блок
        if (blocksData.length > 0 && blocksData[blocksData.length-1]._temp) {
          blocksData.pop();
        }
        
        // Сохраняем финальный текст как блок
        if (currentText.trim()) {
          addBlock(currentText);
        }
        renderBlocks();
      }

      function toggleRec() {
        if (isRecording) stopRec();
        else startRec();
      }

      function saveFile() {
        if (blocksData.length === 0) {
          showToast('❌ Нет текста');
          return;
        }

        const text = blocksData
          .filter(b => !b._temp)
          .map(b => b.text)
          .join('\n\n');

        if (!text.trim()) {
          showToast('❌ Нет текста');
          return;
        }

        const now = new Date();
        const pad = n => String(n).padStart(2, '0');
        const name = now.getFullYear() + '-' + pad(now.getMonth()+1) + '-' + pad(now.getDate()) +
          '_' + pad(now.getHours()) + '-' + pad(now.getMinutes()) + '-' + pad(now.getSeconds()) + '.txt';

        try {
          if (navigator.share) {
            const file = new File([text], name, { type: 'text/plain' });
            navigator.share({ files: [file] }).then(() => {
              showToast('✅ Файл передан в "Поделиться"');
            }).catch(err => {
              if (err.name !== 'AbortError') showToast('❌ ' + err.message);
            });
          } else {
            const blob = new Blob([text], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = name;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            showToast('✅ Сохранено: ' + name);
          }
        } catch(e) {
          showToast('❌ Ошибка: ' + e.message);
        }
      }

      function clearAll() {
        if (blocksData.length === 0) return;
        if (confirm('Очистить все блоки?')) {
          blocksData = [];
          currentText = '';
          renderBlocks();
          showToast('🗑 Очищено');
        }
      }

      // --- События ---
      record.addEventListener('click', toggleRec);
      save.addEventListener('click', saveFile);
      clear.addEventListener('click', clearAll);

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
          e.preventDefault();
          toggleRec();
        }
        if (e.key === 'Escape' && isRecording) {
          e.preventDefault();
          stopRec();
        }
      });

      renderBlocks();
    })();
  </script>
</body>
</html>
